/var/log/torgovo/*.log {
    daily
    rotate 14
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
    dateext
    dateformat -%Y%m%d
    postrotate
        docker exec torgovo-web-1 kill -USR1 1 2>/dev/null || true
    endscript
}

/var/log/torgovo/nginx/*.log {
    daily
    rotate 30
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
    dateext
    postrotate
        docker exec torgovo-nginx-1 nginx -s reopen 2>/dev/null || true
    endscript
}
