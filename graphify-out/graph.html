  #graph { flex: 1; position: relative; overflow: hidden; }

  #info-panel { padding: 14px; border-bottom: 1px solid rgba(78,121,167,0.15); min-height: 140px; }

  #info-content .field { margin-bottom: 5px; }
  #info-content .field b { color: #e0e0e0; }
  #info-content .empty { color: #555; font-style: italic; }
  .neighbor-link { display: block; padding: 2px 6px; margin: 2px 0; border-radius: 3px; cursor: pointer; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-left: 3px solid #333; transition: background 0.2s; }
  .neighbor-link:hover { background: rgba(78,121,167,0.2); }
  #neighbors-list { max-height: 160px; overflow-y: auto; margin-top: 4px; }
  #legend-wrap { flex: 1; overflow-y: auto; padding: 12px; }
  #legend-wrap h3 { font-size: 13px; color: #6d8fd1; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.05em; }
  .legend-item { display: flex; align-items: center; gap: 8px; padding: 4px 0; cursor: pointer; border-radius: 4px; font-size: 12px; }
  .legend-item:hover { background: rgba(78,121,167,0.12); padding-left: 4px; }
  .legend-item.dimmed { opacity: 0.25; }
  .legend-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; box-shadow: 0 0 6px currentColor; }
  .legend-label { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .legend-count { color: #666; font-size: 11px; }
  #stats { padding: 10px 14px; border-top: 1px solid rgba(78,121,167,0.15); font-size: 11px; color: #555; }
  #legend-controls { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; padding: 4px 0; }

  #legend-controls label:hover { color: #e0e0e0; }
  .legend-cb, #select-all-cb { appearance: none; -webkit-appearance: none; width: 14px; height: 14px; border: 1.5px solid rgba(78,121,167,0.4); border-radius: 3px; background: rgba(10,10,26,0.8); cursor: pointer; position: relative; flex-shrink: 0; }
  .legend-cb:checked, #select-all-cb:checked { background: #4E79A7; border-color: #4E79A7; }
  .legend-cb:checked::after, #select-all-cb:checked::after { content: ''; position: absolute; left: 3.5px; top: 1px; width: 4px; height: 7px; border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(45deg); }

  #select-all-cb:indeterminate::after { content: ''; position: absolute; left: 2px; top: 5px; width: 8px; height: 2px; background: #fff; border: none; transform: none; }

// HTML-escape helper — prevents XSS when injecting graph data into innerHTML
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

// Build vis datasets
const nodesDS = new vis.DataSet(RAW_NODES.map(n => ({
  id: n.id, label: n.label, color: n.color, size: n.size,
  font: n.font, title: n.title,
  _community: n.community, _community_name: n.community_name,
  _source_file: n.source_file, _file_type: n.file_type, _degree: n.degree,
  _color_hex: n.color && n.color.background,
  _size: n.size,
})));

const edgesDS = new vis.DataSet(RAW_EDGES.map((e, i) => ({
  id: i, from: e.from, to: e.to,
  label: '',
  title: '',
  dashes: false,
  width: 1,
  hidden: true,
  _rawCount: parseInt(e.label) || 1,
})));

const container = document.getElementById('graph');
const network = new vis.Network(container, { nodes: nodesDS, edges: edgesDS }, {
  physics: {
    enabled: true,
    solver: 'forceAtlas2Based',
    forceAtlas2Based: {
      gravitationalConstant: -40,
      centralGravity: 0.002,
      springLength: 180,
      springConstant: 0.03,
      damping: 0.6,
      avoidOverlap: 0.5,
    },
    stabilization: { iterations: 300, fit: true },
  },
  interaction: {
    hover: true,
    tooltipDelay: 100,
    hideEdgesOnDrag: true,
    navigationButtons: false,
    keyboard: false,

  nodes: { shape: 'dot', borderWidth: 0, size: 14 },
  edges: {
    smooth: { type: 'continuous', roundness: 0.3 },
    selectionWidth: 2,
    width: 0.1,
  },
});

// --- Neuron glow + energy flow particle animation ---
let animId = null;
const particles = [];

function generateParticles() {
  particles.length = 0;
  const edges = edgesDS.get();
  edges.forEach((e) => {
    const count = Math.min(3, Math.max(1, Math.ceil((e._rawCount || 1) / 40)));
    for (let j = 0; j < count; j++) {
      particles.push({
        edgeId: e.id,
        t: Math.random(),
        speed: 0.002 + Math.random() * 0.004,
        size: 1.5 + Math.random() * 2.5,
        alpha: 0.4 + Math.random() * 0.6,
        offset: (j / count) * 0.5,
      });
    }
  });
}

function animateParticles() {
  particles.forEach(p => {
    p.t += p.speed;
    if (p.t > 1) p.t = 0;
  });
  if (network) network.redraw();
  animId = requestAnimationFrame(animateParticles);
}

network.once('stabilizationIterationsDone', () => {
  network.setOptions({ physics: { enabled: false } });
  generateParticles();
  animateParticles();
});

function showInfo(nodeId) {
  const n = nodesDS.get(nodeId);
  if (!n) return;
  const neighborIds = network.getConnectedNodes(nodeId);
  const neighborItems = neighborIds.map(nid => {
    const nb = nodesDS.get(nid);
    const color = nb ? nb.color.background : '#555';
    return `<span class="neighbor-link" style="border-left-color:${esc(color)}" onclick="focusNode(${JSON.stringify(nid)})">${esc(nb ? nb.label : nid)}</span>`;
  }).join('');
  document.getElementById('info-content').innerHTML = `
    <div class="field"><b>${esc(n.label)}</b></div>
    <div class="field">Type: ${esc(n._file_type || 'unknown')}</div>
    <div class="field">Community: ${esc(n._community_name)}</div>
    <div class="field">Source: ${esc(n._source_file || '-')}</div>
    <div class="field">Degree: ${n._degree}</div>
    ${neighborIds.length ? `<div class="field" style="margin-top:8px;color:#aaa;font-size:11px">Neighbors (${neighborIds.length})</div><div id="neighbors-list">${neighborItems}</div>` : ''}
  `;
}

function focusNode(nodeId) {
  network.focus(nodeId, { scale: 1.4, animation: true });
  network.selectNodes([nodeId]);
  showInfo(nodeId);
}

// Track hovered node — hover detection is more reliable than click params
let hoveredNodeId = null;
network.on('hoverNode', params => {
  hoveredNodeId = params.node;
  container.style.cursor = 'pointer';
});
network.on('blurNode', () => {
  hoveredNodeId = null;
  container.style.cursor = 'default';
});

// --- Custom edge hover detection (matches actual drawn bezier paths) ---
let hoveredEdgeId = null;
let mouseCanvasPos = null;
let hoverCheckPending = false;

container.addEventListener('mousemove', (e) => {
  const rect = container.getBoundingClientRect();
  mouseCanvasPos = network.DOMtoCanvas({
    x: e.clientX - rect.left,
    y: e.clientY - rect.top
  });
  if (!hoverCheckPending) {
    hoverCheckPending = true;
    requestAnimationFrame(() => {
      hoverCheckPending = false;
      updateEdgeHover();
    });
  }
});

function updateEdgeHover() {
  if (!mouseCanvasPos) return;
  const mx = mouseCanvasPos.x, my = mouseCanvasPos.y;
  const edges = edgesDS.get();
  const positions = network.getPositions();
  if (!positions) return;

  let closestId = null;
  let closestDist = 14;

  edges.forEach(e => {
    const fromPos = positions[e.from];
    const toPos = positions[e.to];
    if (!fromPos || !toPos) return;
    const fromNode = nodesDS.get(e.from);
    const toNode = nodesDS.get(e.to);
    if ((fromNode && fromNode.hidden) || (toNode && toNode.hidden)) return;
    const path = computeControl(fromPos, toPos, e.id);
    if (!path) return;

    // Sample points along the exact bezier that afterDrawing uses
    for (let s = 0; s <= 1; s += 0.04) {
      const pt = bezierPoint(path, s);
      const d = Math.sqrt((pt.x - mx) ** 2 + (pt.y - my) ** 2);
      if (d < closestDist) {
        closestDist = d;
        closestId = e.id;
      }
    }
  });

  if (closestId !== hoveredEdgeId) {
    hoveredEdgeId = closestId;
    // Only override cursor when not on a node
    if (hoveredNodeId === null) {
      container.style.cursor = closestId !== null ? 'pointer' : 'default';
    }
    if (network) network.redraw();
  }
}
container.addEventListener('click', () => {
  if (hoveredNodeId !== null) {
    showInfo(hoveredNodeId);
    network.selectNodes([hoveredNodeId]);
  }
});
function showEdgeInfo(edgeId) {
  const edge = edgesDS.get(edgeId);

  const fromNode = nodesDS.get(edge.from);
  const toNode = nodesDS.get(edge.to);
  const info = document.getElementById('info-content');
  if (edge._rawCount === 1) {
    info.innerHTML = `<div class="field"><b>${esc(fromNode ? fromNode.label : edge.from)}</b> → <b>${esc(toNode ? toNode.label : edge.to)}</b></div><div class="field">1 cross-community edge</div>`;
  } else {
    info.innerHTML = `<div class="field"><b>${esc(fromNode ? fromNode.label : edge.from)}</b> → <b>${esc(toNode ? toNode.label : edge.to)}</b></div><div class="field">${edge._rawCount} cross-community edges (aggregated)</div>`;
  }
}

network.on('click', params => {
  if (params.nodes.length > 0) {
    showInfo(params.nodes[0]);
  } else if (params.edges.length > 0) {
    showEdgeInfo(params.edges[0]);
  } else if (hoveredNodeId === null) {
    document.getElementById('info-content').innerHTML = '<span class="empty">Click a node or edge to inspect it</span>';
  }
});

const searchInput = document.getElementById('search');
const searchResults = document.getElementById('search-results');
searchInput.addEventListener('input', () => {
  const q = searchInput.value.toLowerCase().trim();
  searchResults.innerHTML = '';
  if (!q) { searchResults.style.display = 'none'; return; }
  const matches = RAW_NODES.filter(n => n.label.toLowerCase().includes(q)).slice(0, 20);
  if (!matches.length) { searchResults.style.display = 'none'; return; }
  searchResults.style.display = 'block';
  matches.forEach(n => {
    const el = document.createElement('div');
    el.className = 'search-item';
    el.textContent = n.label;
    el.style.borderLeft = `3px solid ${n.color.background}`;
    el.style.paddingLeft = '8px';
    el.onclick = () => {
      network.focus(n.id, { scale: 1.5, animation: true });
      network.selectNodes([n.id]);
      showInfo(n.id);
      searchResults.style.display = 'none';
      searchInput.value = '';
    };
    searchResults.appendChild(el);
  });
});
document.addEventListener('click', e => {
  if (!searchResults.contains(e.target) && e.target !== searchInput)
    searchResults.style.display = 'none';
});

const hiddenCommunities = new Set();

const selectAllCb = document.getElementById('select-all-cb');

function updateSelectAllState() {
  const total = LEGEND.length;
  const hidden = hiddenCommunities.size;
  selectAllCb.checked = hidden === 0;
  selectAllCb.indeterminate = hidden > 0 && hidden < total;
}

function toggleAllCommunities(hide) {
  document.querySelectorAll('.legend-item').forEach(item => {
    hide ? item.classList.add('dimmed') : item.classList.remove('dimmed');
  });
  document.querySelectorAll('.legend-cb').forEach(cb => {
    cb.checked = !hide;
  });
  LEGEND.forEach(c => {
    if (hide) hiddenCommunities.add(c.cid); else hiddenCommunities.delete(c.cid);
  });
  const updates = RAW_NODES.map(n => ({ id: n.id, hidden: hide }));
  nodesDS.update(updates);
  updateSelectAllState();
}

const legendEl = document.getElementById('legend');
LEGEND.forEach(c => {
  const item = document.createElement('div');
  item.className = 'legend-item';
  const cb = document.createElement('input');
  cb.type = 'checkbox';
  cb.className = 'legend-cb';
  cb.checked = true;
  cb.addEventListener('change', (e) => {
    e.stopPropagation();
    if (cb.checked) {
      hiddenCommunities.delete(c.cid);
      item.classList.remove('dimmed');
    } else {
      hiddenCommunities.add(c.cid);
      item.classList.add('dimmed');
    }
    const updates = RAW_NODES
      .filter(n => n.community === c.cid)
      .map(n => ({ id: n.id, hidden: !cb.checked }));
    nodesDS.update(updates);
    updateSelectAllState();
  });
  item.innerHTML = `<div class="legend-dot" style="background:${c.color}"></div>
    <span class="legend-label">${c.label}</span>
    <span class="legend-count">${c.count}</span>`;
  item.prepend(cb);
  item.onclick = (e) => {
    if (e.target === cb) return;
    cb.checked = !cb.checked;
    cb.dispatchEvent(new Event('change'));
  };
  legendEl.appendChild(item);
});
</script>
<script>
// --- Custom rail path computation (shared by edges + particles) ---
function computeControl(fromPos, toPos, edgeId) {
  const dx = toPos.x - fromPos.x;
  const dy = toPos.y - fromPos.y;
  const len = Math.sqrt(dx * dx + dy * dy);
  if (len < 1) return null;
  const midX = (fromPos.x + toPos.x) / 2;
  const midY = (fromPos.y + toPos.y) / 2;
  const dir = (edgeId % 2 === 0) ? 1 : -1;
  const offset = len * 0.3 * dir;
  return {
    cpx: midX + (-dy / len) * offset,
    cpy: midY + (dx / len) * offset,
    from: fromPos, to: toPos,
  };
}

function bezierPoint(path, t) {
  const u = 1 - t;
  return {
    x: u*u*path.from.x + 2*u*t*path.cpx + t*t*path.to.x,
    y: u*u*path.from.y + 2*u*t*path.cpy + t*t*path.to.y,
  };
}

// --- Neuron glow + energy flow rendering ---
network.on('afterDrawing', function(ctx) {
  const nodes = nodesDS.get();
  const positions = network.getPositions(nodes.map(n => n.id));
  if (!positions) return;

  // 1. Draw synaptic glow halos around all nodes
  nodes.forEach(n => {
    const pos = positions[n.id];
    if (!pos) return;
    const color = n._color_hex || '#4E79A7';
    const size = Math.max(4, (n._size || 10) * 1.3);

    // Outer aura (transmembrane glow)
    const aura = ctx.createRadialGradient(pos.x, pos.y, size * 0.2, pos.x, pos.y, size * 3.5);
    aura.addColorStop(0, color + '30');
    aura.addColorStop(0.4, color + '15');
    aura.addColorStop(1, color + '00');
    ctx.fillStyle = aura;
    ctx.beginPath();
    ctx.arc(pos.x, pos.y, size * 3.5, 0, Math.PI * 2);
    ctx.fill();

    // Soma (cell body) — bright core with gradient
    const soma = ctx.createRadialGradient(pos.x - size * 0.25, pos.y - size * 0.25, 0, pos.x, pos.y, size);
    soma.addColorStop(0, '#ffffffd0');
    soma.addColorStop(0.15, color + 'e0');
    soma.addColorStop(0.6, color + 'b0');
    soma.addColorStop(1, color + '60');
    ctx.fillStyle = soma;
    ctx.beginPath();
    ctx.arc(pos.x, pos.y, size, 0, Math.PI * 2);
    ctx.fill();

    // Bright rim highlight (like a neural membrane)
    ctx.strokeStyle = color + '60';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(pos.x, pos.y, size * 0.85, 0, Math.PI * 2);
    ctx.stroke();
  });

  // 2. Pre-compute rail paths for all visible edges then draw them + particles
  const allEdges = edgesDS.get();
  const railPaths = {};

  allEdges.forEach(e => {
    const fromPos = positions[e.from];
    const toPos = positions[e.to];
    if (!fromPos || !toPos) return;
    const fromNode = nodesDS.get(e.from);
    const toNode = nodesDS.get(e.to);
    if ((fromNode && fromNode.hidden) || (toNode && toNode.hidden)) return;
    const path = computeControl(fromPos, toPos, e.id);
    if (!path) return;
    railPaths[e.id] = path;

    // Draw the edge rail itself (same bezier as particles will follow)
    const railColor = (fromNode && fromNode._color_hex) || '#4E79A7';
    const isHovered = e.id === hoveredEdgeId;
    const segments = 30;

    ctx.beginPath();
    ctx.moveTo(fromPos.x, fromPos.y);
    for (let s = 1; s <= segments; s++) {
      const pt = bezierPoint(path, s / segments);
      ctx.lineTo(pt.x, pt.y);
    }

    if (isHovered) {
      // Hover glow: bright, thick, with shadow
      ctx.shadowColor = railColor;
      ctx.shadowBlur = 25;
      ctx.strokeStyle = railColor + '90';
      ctx.lineWidth = 3;
      ctx.stroke();
      ctx.shadowBlur = 0;
      // Re-stroke brighter core
      ctx.strokeStyle = railColor + 'c0';
      ctx.lineWidth = 1.5;
      ctx.stroke();
    } else {
      ctx.strokeStyle = railColor + '20';
      ctx.lineWidth = 1.2;
      ctx.stroke();
      // Subtle glow under the rail
      ctx.strokeStyle = railColor + '10';
      ctx.lineWidth = 3;
      ctx.stroke();
    }

    // Arrowhead at the end
    const tip = bezierPoint(path, 0.98);
    const rear = bezierPoint(path, 0.94);
    const aAngle = Math.atan2(tip.y - rear.y, tip.x - rear.x);
    const aSize = isHovered ? 7 : 5;
    ctx.fillStyle = isHovered ? (railColor + 'e0') : (railColor + '40');
    if (isHovered) {
      ctx.shadowColor = railColor;
      ctx.shadowBlur = 15;
    }
    ctx.beginPath();
    ctx.moveTo(tip.x, tip.y);
    ctx.lineTo(tip.x - aSize * Math.cos(aAngle - 0.4), tip.y - aSize * Math.sin(aAngle - 0.4));
    ctx.lineTo(tip.x - aSize * Math.cos(aAngle + 0.4), tip.y - aSize * Math.sin(aAngle + 0.4));
    ctx.closePath();
    ctx.fill();
    ctx.shadowBlur = 0;
  });

  // 3. Draw energy particles travelling on the exact same rails
  particles.forEach(p => {
    const path = railPaths[p.edgeId];
    if (!path) return;

    let t = p.t + p.offset;
    if (t > 1) t -= 1;

    const pt = bezierPoint(path, t);
    const edge = edgesDS.get(p.edgeId);
    const fromNode = edge ? nodesDS.get(edge.from) : null;
    const pColor = (fromNode && fromNode._color_hex) || '#4E79A7';

    // Energy trail (fading behind the particle)
    const trailSteps = 10;
    for (let s = 1; s <= trailSteps; s++) {
      const st = t - s * 0.006;
      if (st < 0) continue;
      const tp = bezierPoint(path, st);
      const alpha = p.alpha * (1 - s / trailSteps) * 0.4;
      const r = p.size * (1 - s / trailSteps) * 0.7;
      ctx.fillStyle = `rgba(180, 210, 255, ${alpha})`;
      ctx.beginPath();
      ctx.arc(tp.x, tp.y, Math.max(0.5, r), 0, Math.PI * 2);
      ctx.fill();
    }

    // Main particle (bright signal spike)
    ctx.shadowColor = pColor;
    ctx.shadowBlur = 18;
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(pt.x, pt.y, p.size * 0.6, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = pColor;
    ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.arc(pt.x, pt.y, p.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
  });

  // 4. Hover tooltip for edges
  if (hoveredEdgeId !== null && mouseCanvasPos) {
    const edge = edgesDS.get(hoveredEdgeId);
    if (edge) {
      const fromNode = nodesDS.get(edge.from);
      const toNode = nodesDS.get(edge.to);
      const label = `${fromNode ? fromNode.label : '?'} → ${toNode ? toNode.label : '?'}`;
      const sub = edge._rawCount > 1 ? `${edge._rawCount} edges` : '1 edge';

      ctx.save();
      ctx.font = '12px sans-serif';
      const tw = ctx.measureText(label).width;
      const sw = ctx.measureText(sub).width;
      const boxW = Math.max(tw, sw) + 16;
      const boxH = 40;
      let tx = mouseCanvasPos.x + 12;
      let ty = mouseCanvasPos.y - boxH - 8;
      const canvasW = container.clientWidth;
      const canvasH = container.clientHeight;
      const domPos = network.canvasToDOM({ x: tx, y: ty });
      if (domPos.x + boxW > canvasW) tx = mouseCanvasPos.x - boxW - 12;
      if (domPos.y < 0) ty = mouseCanvasPos.y + 12;

      ctx.fillStyle = 'rgba(10,10,26,0.88)';
      ctx.strokeStyle = 'rgba(78,121,167,0.4)';
      ctx.lineWidth = 1;
      roundRect(ctx, tx, ty, boxW, boxH, 6);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = '#e0e0e0';
      ctx.textAlign = 'left';
      ctx.font = 'bold 12px sans-serif';
      ctx.fillText(label, tx + 8, ty + 17);
      ctx.fillStyle = '#888';
      ctx.font = '11px sans-serif';
      ctx.fillText(sub, tx + 8, ty + 32);
      ctx.restore();
    }
  }
});

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}
</script>
