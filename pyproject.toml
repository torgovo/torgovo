[tool.black]
line-length = 100
target-version = ['py312']

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".git", ".venv", "venv", "node_modules", "frontend"]
filterwarnings = [
    "ignore::DeprecationWarning:django_filters",
    "ignore::DeprecationWarning:pytz",
    "ignore::DeprecationWarning:ccxt",
    "ignore::DeprecationWarning:jwt",
    "ignore:datetime.datetime.utcnow:DeprecationWarning",
    "ignore::RuntimeWarning:django.db.models.fields",
]
