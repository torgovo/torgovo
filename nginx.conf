events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log;

    # Basic settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 10M;
    server_tokens off;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss
               application/rss+xml application/atom+xml image/svg+xml;

    # ---- Rate limit zones ---------------------------------------------------
    # 10 MB = ~160k unique IPs tracked. Adjust as needed.
    limit_req_zone $binary_remote_addr zone=login_zone:10m   rate=10r/m;
    limit_req_zone $binary_remote_addr zone=api_zone:10m     rate=120r/m;
    limit_req_zone $binary_remote_addr zone=webhook_zone:10m rate=300r/m;
    limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

    # Upstream to Django application
    upstream django {
        server web:8000;
        keepalive 32;
    }

    # ---- HTTP -> HTTPS redirect --------------------------------------------
    server {
        listen 80 default_server;
        server_name _;
        # Allow Let's Encrypt / certbot challenge if used.
        location /.well-known/acme-challenge/ { root /var/www/certbot; }
        location / { return 301 https://$host$request_uri; }
    }

    # ---- HTTPS production server -------------------------------------------
    server {
        listen 443 ssl http2;
        server_name _;

        # TLS certs — mount into /etc/nginx/ssl/ via docker-compose
        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;

        # Strong TLS only
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers ECDHE+AESGCM:ECDHE+CHACHA20:!aNULL:!MD5:!3DES;
        ssl_session_cache shared:SSL:50m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;
        ssl_stapling on;
        ssl_stapling_verify on;

        # Per-connection limits (slow-loris / connection floods)
        limit_conn conn_per_ip 50;

        # Security headers (Django/DRF also sets some; we set them here for
        # defence in depth, including static/media responses).
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        # CSP is set in Django middleware; do not duplicate or it'll conflict.

        # Static / media
        location /static/ {
            alias /app/staticfiles/;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
        location /media/ {
            alias /app/media/;
            expires 1M;
            add_header Cache-Control "public";
        }

        # Health check
        location /health/ {
            proxy_pass http://django;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            access_log off;
        }

        # Auth endpoints — tight rate limit
        location ~ ^/api/auth/(login|register|password-reset)/ {
            limit_req zone=login_zone burst=5 nodelay;
            proxy_pass http://django;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Signal bot webhook — TradingView-only (exact match so indicator views
        # at /api/webhooks/custombot/indicators/… aren't blocked for real users).
        # TradingView currently sends from these 4 IPs (verify periodically):
        #   https://www.tradingview.com/support/solutions/43000529348
        # This list was current as of June 2026 — TradingView does update it,
        # so check once per quarter.
        location = /api/webhooks/custombot/ {
            allow 52.89.214.238;
            allow 34.212.75.30;
            allow 54.218.53.128;
            allow 52.32.178.7;
            deny all;
            limit_req zone=webhook_zone burst=50 nodelay;
            proxy_pass http://django;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Django admin — IP-allowlist this in production (uncomment + edit).
        # location /admin/ {
        #     allow 1.2.3.4;
        #     deny all;
        #     proxy_pass http://django;
        # }

        # Default API (includes WebSocket support for Django Channels)
        location / {
            limit_req zone=api_zone burst=200 nodelay;
            proxy_pass http://django;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 30s;
            proxy_send_timeout 60s;
            proxy_read_timeout 86400s;
        }
    }
}
