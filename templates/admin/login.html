{% extends "admin/login.html" %}
{% load i18n static %}

{% block extrastyle %}
{{ block.super }}
<style>
:root {
  --primary: #1a1a2e;
  --accent: #00d4aa;
  --accent-hover: #00b894;
}
body {
  background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}
#container {
  background: white;
  border-radius: 12px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.2);
  max-width: 400px;
  width: 100%;
}
#header {
  background: var(--primary);
  border-radius: 12px 12px 0 0;
  border-bottom: 3px solid var(--accent);
}
#header h1 {
  font-size: 20px;
}
#content {
  padding: 30px;
}
#content-main form {
  margin-top: 0;
}
.form-row {
  padding: 8px 0;
}
.form-row input {
  border-radius: 6px;
  border: 1px solid #ddd;
  padding: 10px 12px;
  width: 100%;
  box-sizing: border-box;
}
.submit-row input {
  background: var(--accent);
  color: white;
  border: none;
  padding: 12px 24px;
  border-radius: 6px;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.2s;
}
.submit-row input:hover {
  background: var(--accent-hover);
}
#branding h1 a:link, #branding h1 a:visited {
  color: white;
  text-decoration: none;
}
.errornote {
  border-radius: 6px;
}
</style>
{% endblock %}

{% block branding %}
<h1 id="site-name"><a href="{% url 'admin:index' %}">Torgovo Trading Platform</a></h1>
{% endblock %}

{% block usertools %}{% endblock %}
