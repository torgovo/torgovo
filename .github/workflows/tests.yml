name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/development.txt
      - name: Run pre-commit (black / isort / flake8 / hooks)
        run: pre-commit run --all-files --show-diff-on-failure

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/development.txt
      - name: Django system check
        run: python manage.py check
        env:
          SECRET_KEY: test-secret-key-for-ci-12345678
          FERNET_KEY: Vw1oIt2-ldkqoA62pHf3uu-683L7nmuna60HvTt50Uc=
      - name: Run tests
        run: |
          python -m pytest tests/ --nomigrations -q --tb=short --cov=apps --cov-report=term --cov-fail-under=80
        env:
          SECRET_KEY: test-secret-key-for-ci-12345678
          FERNET_KEY: Vw1oIt2-ldkqoA62pHf3uu-683L7nmuna60HvTt50Uc=
